name: Run backend unit tests

on:
  pull_request:
    branches:
      - "*"
    paths:
      - "go.mod"
      - "main.go"
      - "main_test.go"
      - "backend/**"
      - ".github/workflows/build-backend.yaml"

jobs:
  generate-binaries:
    name: Check-out code and run backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: dependencies
        uses: apt install -y gtk+-3.0 gio-unix-2.0 webkit2gtk-4.1 gtk+-3.0 gio-unix-2.0 webkit2gtk-4.1 gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 gtk+-3.0 gio-unix-2.0 webkit2gtk-4.1
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean workdir
        run: make clean

      - name: Run go tests
        run: make test
