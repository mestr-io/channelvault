name: Build & Test Wails App

on:
  pull_request:
    branches:
      - "*"
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yaml"

jobs:
  generate-binaries:
    name: Generate binaries and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build wails
        uses: dAppServer/wails-build-action@main
        with:
          build-name: wailsApp
          build-platform: linux/amd64
          package: false

      - name: Build wails go app
        run: make build

      - name: Install Xvfb and dependencies
        run: sudo apt update && sudo apt install -y xvfb xauth

      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1024x768x24 &
        env:
          DISPLAY: :99

      - name: Run go testsh
        run: make testh
        env:
          DISPLAY: :99
