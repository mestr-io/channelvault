name: Run backend unit tests

on:
  pull_request:
    branches:
      - "*"
    paths:
      - "go.mod"
      - "main.go"
      - "main_test.go"
      - "backend/**"
      - ".github/workflows/build-backend.yaml"

jobs:
  generate-binaries:
    name: Check-out code and run backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgio-unix-2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean workdir
        run: make clean

      - name: Run go tests
        run: make test
