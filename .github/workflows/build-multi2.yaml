name: ChannelVault multi-build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          [
            { name: wailsTest, platform: linux/amd64, os: ubuntu-latest },
            { name: wailsTest, platform: windows/amd64, os: windows-latest },
            { name: wailsTest, platform: darwin/universal, os: macos-latest },
          ]
    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup build environment
        run: echo "Setting up build environment on ${{ runner.os }}"
      - name: Set output path based on OS
        id: set_paths
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            echo "成果物パス=./build/macos" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" == "Windows" ]; then
            echo "成果物パス=./build/windows" >> $GITHUB_ENV
          else
            echo "成果物パス=./build/linux" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Build
        uses: ./.github/workflows/wails.yml
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          build-obfuscate: true
          go-version: "^1.24"
