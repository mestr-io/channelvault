name: ChannelVault multi-build

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@main
        with:
          build-name: ChannelVault
          build-platform: linux/amd64
          wails-build-webview2: "embed"
          build-obfuscate: true
          go-version: "^1.24"
          package: false
      - name: Listar archivos en el repositorio
        shell: bash
        run: |
          echo "Los archivos en el directorio de trabajo son:"
          export TARNAME=$(ls build/bin/ChannelVault*)
          echo $TARNAME
          tar -cvf $TARNAME.tar.gz ./$TARNAME
          ls -l build/bin
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@main
        with:
          build-name: ChannelVault
          build-platform: darwin/universal
          build-obfuscate: true
          go-version: "^1.24"
          package: false
      - name: Listar archivos en el repositorio
        shell: bash
        run: |
          echo "Los archivos en el directorio de trabajo son:"
          ls -l build/bin/
          echo "para guardar (package: true) el .zip generado edite el job ./github/buildit.yaml"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@main
        with:
          build-name: ChannelVault.exe
          build-platform: windows/amd64
          wails-build-webview2: "embed"
          nsis: true
          build-obfuscate: true
          go-version: "^1.24"
          package: false
      - name: Listar archivos en el repositorio
        shell: bash
        run: |
          echo "Los archivos en el directorio de trabajo son:"
          export ZIPNAME=$(ls build/bin/ChannelVault*.exe | sed 's/exe/zip/')
          export DSTNAME=$(ls build/bin/ChannelVault*.exe )
          ls -l build/bin
          cd build/bin && Compress-Archive -Path $DSTNAME $ZIPNAME
