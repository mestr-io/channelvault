name: Format Check

on:
  pull_request:
    branches:
      - "*"

jobs:
  format-check:
    name: Run Biome Formatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Biome Formatter Check
        working-directory: ./frontend
        run: npx @biomejs/biome format

      - name: Build wails
        uses: dAppServer/wails-build-action@v2.2
        id: build
        with:
          build-name: 'App'
          build-platform: 'linux/amd64'
          package: false
          go-version: '1.20'
      
      - name: Build wails go app
        run: make build

      - name: Run go tests
        run: make test
